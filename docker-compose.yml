services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirror-docker.runflare.com/laravel_13_app
    container_name: laravel_13_app
    depends_on:
      - mysql
      - redis
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - storage:/var/www/html/storage
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    container_name: laravel_13_nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

  mysql:
    image: mysql:8.0
    container_name: laravel_13_mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: laravel_13_phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8081:80"
    networks:
      - appnet

  redis:
    image: redis:alpine
    container_name: laravel_13_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - appnet

  node:
    image: node:20-alpine
    container_name: laravel_13_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run build && tail -f /dev/null"
    networks:
      - appnet

volumes:
  vendor:
  node_modules:
  storage:
  dbdata:

networks:
  appnet:
    driver: bridge
